/* MAIN */

/* CARDS */

.card{

}

.card h2{

}

/* STUDENT */

.student-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}
.input-group{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.input-group label{
    color:#f5f5f5;
    font-size:16px;
    font-weight:500;
}
input[type="text"],
input[type="tel"]{
    width:100%;
    padding:14px;
    background:#10171e;
    border:1px solid #344654;
    border-radius:7px;
    color:white;
    font-size:15px;
}

/* QUESTION */

.question-number{
    color:#ffc75f;
    font-weight:bold;
    margin-bottom:15px;
}

.question-text{
    white-space:pre-line;
    line-height:1.6;
    font-size:17px;
    margin-bottom:18px;
}

/* OPTIONS */

.option{
    display:block;
    background:#10171e;
    border:1px solid #344654;
    padding:14px;
    border-radius:7px;
    margin-bottom:10px;
    cursor:pointer;
}

.option:hover{
    border-color:#ffc75f;
}

.option input{
    margin-right:12px;
}

/* SUBMIT */

.submit-area{
    text-align:center;
    padding:20px;
}

.submit-btn{
    border:none;
    background:linear-gradient(90deg,#e6a51b,#ffe28e);
    color:#111;
    font-size:16px;
    font-weight:bold;
    padding:16px 40px;
    border-radius:9px;
    cursor:pointer;
}

/* RESULT */

.result-summary{
    text-align:center;
    background:#1b232b;
    border:1px solid #31414e;
    border-radius:12px;
    padding:25px;
    margin-bottom:25px;
}

.score{
    color:#ffc75f;
    font-size:30px;
    font-weight:bold;
}

.correct{
    border-left:5px solid #42c97b;
}

.wrong{
    border-left:5px solid #e75b5b;
}

.answer-box{
    padding:12px;
    margin-top:10px;
    border-radius:6px;
    background:#10171e;
}

.correct-answer{

}

.wrong-answer{

}

.explanation{

    padding:15px;
    background:#252f38;
    border-radius:7px;

@media(max-width:600px){

/* =========================================================
   DISPLAY QUESTIONS
   ========================================================= */


function renderQuestions(){

    const container =
        document.getElementById("questionsContainer");

    container.innerHTML = "";

    questions.forEach((question,index)=>{

        let optionsHTML = "";

        question.options.forEach((option,optionIndex)=>{

            optionsHTML += `

                <label class="option">

                    <input
                        type="radio"
                        name="question_${index}"
                        value="${escapeHTML(option)}"
                    >

                    ${escapeHTML(option)}

                </label>

            `;

        });


        container.innerHTML += `

            <div class="card">

                <div class="question-number">
                    QUESTION ${index + 1}
                </div>

                <div class="question-text">
                    ${escapeHTML(question.title)}
                </div>

                ${optionsHTML}

            </div>

        `;

    });

}


/* =========================================================
   SUBMIT TEST
   ========================================================= */


function submitTest(){

    const studentName =
        document.getElementById("studentName").value.trim();

    const studentPhone =
        document.getElementById("studentPhone").value.trim();


    if(!studentName){

        alert("Please enter Student Name.");

        document.getElementById("studentName").focus();

        return;

    }


    if(!studentPhone){

        alert("Please enter Phone Number.");

        document.getElementById("studentPhone").focus();

        return;

    }


    let unanswered = [];


    questions.forEach((question,index)=>{

        const selected =
            document.querySelector(
                `input[name="question_${index}"]:checked`
            );

        if(!selected){

            unanswered.push(index + 1);

        }

    });


    if(unanswered.length > 0){

        alert(
            "Please answer all questions.\n\n" +
            "Unanswered questions: " +
            unanswered.join(", ")
        );

        return;

    }


    let score = 0;

    let reviewHTML = "";


    questions.forEach((question,index)=>{


        const selected =
            document.querySelector(
                `input[name="question_${index}"]:checked`
            );


        const studentAnswer =
            selected.value;


        const correctAnswers = Array.isArray(question.correctAnswers)
            ? question.correctAnswers
            : [];

        const isCorrect =
            correctAnswers.includes(studentAnswer);

        if(isCorrect){
            score++;
        }

        const feedback = isCorrect
            ? (question.correctFeedback || "")
            : (question.incorrectFeedback || "");

        reviewHTML += `

            <div class="card ${isCorrect ? "correct" : "wrong"}">

                <div class="question-number">

                    QUESTION ${index + 1}
                    ${isCorrect ? "✔ CORRECT" : "✘ WRONG"}

                </div>

                <div class="question-text">

                    ${escapeHTML(question.title)}

                </div>

                <div class="answer-box">

                    <strong>Your Answer:</strong><br>

                    <span class="${isCorrect ? "correct-answer" : "wrong-answer"}">

                        ${escapeHTML(studentAnswer)}

                    </span>

                </div>

                <div class="answer-box">

                    <strong>Correct Answer:</strong><br>

                    <span class="correct-answer">

                        ${escapeHTML(correctAnswers.join(", "))}

                    </span>

                </div>

                <div class="explanation">

                    <strong>${isCorrect ? "Correct Feedback:" : "Explanation:"}</strong><br><br>

                    ${escapeHTML(feedback)}

                </div>

            </div>

        `;

    });


    document.getElementById("testContainer")
        .style.display = "none";


    const resultContainer =
        document.getElementById("resultContainer");


    resultContainer.style.display = "block";


    resultContainer.innerHTML = `

        <div class="result-summary">

            <h2>TEST RESULT</h2>

            <p><strong>Student:</strong>
            ${escapeHTML(studentName)}</p>

            <p><strong>Phone:</strong>
            ${escapeHTML(studentPhone)}</p>

            <div class="score">

                ${score} / ${questions.length}

            </div>

            <p>

                You can now review every question,
                your answer, correct answer and feedback.

            </p>

        </div>


        ${reviewHTML}

    `;


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =========================================================
   SECURITY / HTML ESCAPE
   ========================================================= */


function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* START TEST */


renderQuestions();
