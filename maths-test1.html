<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 9 Maths – Free Test 1 | BET Masterclass</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b1117;
    color:#f5f5f5;
}

/* HEADER */

header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    border-bottom:1px solid #2b3945;
    background:#0b1117;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#f4bd4f;
}

.back-btn{
    color:#f4bd4f;
    text-decoration:none;
    border:1px solid #b88425;
    padding:10px 18px;
    border-radius:8px;
}

/* TITLE */

.test-header{
    text-align:center;
    padding:30px 15px;
    border-bottom:1px solid #2b3945;
}

.test-header h1{
    margin:0;
    color:#ffc75f;
    font-size:28px;
}

.test-header p{
    color:#c5cbd3;
}

/* MAIN */

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* CARDS */

.card{
    background:#1b232b;
    border:1px solid #31414e;
    border-radius:12px;
    padding:22px;
    margin-bottom:20px;
}

.card h2{
    margin-top:0;
    color:#ffc75f;
}

/* STUDENT */

.student-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}
.input-group{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.input-group label{
    color:#f5f5f5;
    font-size:16px;
    font-weight:500;
}
input[type="text"],
input[type="tel"]{
    width:100%;
    padding:14px;
    background:#10171e;
    border:1px solid #344654;
    border-radius:7px;
    color:white;
    font-size:15px;
}

/* QUESTION */

.question-number{
    color:#ffc75f;
    font-weight:bold;
    margin-bottom:15px;
}

.question-text{
    white-space:pre-line;
    line-height:1.6;
    font-size:17px;
    margin-bottom:18px;
}

/* OPTIONS */

.option{
    display:block;
    background:#10171e;
    border:1px solid #344654;
    padding:14px;
    border-radius:7px;
    margin-bottom:10px;
    cursor:pointer;
}

.option:hover{
    border-color:#ffc75f;
}

.option input{
    margin-right:12px;
}

/* SUBMIT */

.submit-area{
    text-align:center;
    padding:20px;
}

.submit-btn{
    border:none;
    background:linear-gradient(90deg,#e6a51b,#ffe28e);
    color:#111;
    font-size:16px;
    font-weight:bold;
    padding:16px 40px;
    border-radius:9px;
    cursor:pointer;
}

/* RESULT */

.result-summary{
    text-align:center;
    background:#1b232b;
    border:1px solid #31414e;
    border-radius:12px;
    padding:25px;
    margin-bottom:25px;
}

.score{
    color:#ffc75f;
    font-size:30px;
    font-weight:bold;
}

.correct{
    border-left:5px solid #42c97b;
}

.wrong{
    border-left:5px solid #e75b5b;
}

.answer-box{
    padding:12px;
    margin-top:10px;
    border-radius:6px;
    background:#10171e;
}

.correct-answer{
    color:#70e69a;
}

.wrong-answer{
    color:#ff7777;
}

.explanation{
    margin-top:15px;
    padding:15px;
    background:#252f38;
    border-radius:7px;
    line-height:1.5;
}

@media(max-width:600px){

    .student-grid{
        grid-template-columns:1fr;
    }

    .test-header h1{
        font-size:22px;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">🎓 BET MASTERCLASS</div>

    <a href="class9.html" class="back-btn">
        ← Back to Class 9
    </a>

</header>


<div class="test-header">

    <h1>CLASS 9 MATHS – FREE TEST 1</h1>

    <p>Answer all questions and submit your test.</p>

</div>


<div class="container" id="testContainer">

    <!-- STUDENT DETAILS -->

    <div class="card student-card">

    <h2>Student Details</h2>

    <div class="student-grid">

        <div class="input-group">
            <label for="studentName">Student Name</label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
                required
            >
        </div>

        <div class="input-group">
            <label for="studentPhone">Phone Number</label>

            <input
                type="tel"
                id="studentPhone"
                placeholder="Enter your phone number"
                required
            >
        </div>

    </div>

</div>


    <!-- QUESTIONS WILL APPEAR HERE -->

    <div id="questionsContainer"></div>


    <div class="submit-area">

        <button class="submit-btn" onclick="submitTest()">
            SUBMIT TEST
        </button>

    </div>

</div>


<div class="container" id="resultContainer" style="display:none;"></div>


<script>

/* FIX VERSION: correctAnswers + feedback schema */

/* =========================================================
   MATHS TEST 1 DATA
   =========================================================

   REPLACE THIS SAMPLE DATA WITH YOUR EXTRACTED MATHS TEST 1
   QUESTIONS.

   The system automatically displays ALL questions in this array.
*/


const questions = [
    
    {
      "itemNumber": 1,
      "title": "1. Assertion: Transport is necessary for economic development.\nReason: Goods do not move on their own.",
      "helpText": "",
      "type": "MULTIPLE_CHOICE",
      "required": true,
      "options": [
        "Both A and R are true and R explains A",
        "Both A and R are true but R does not explain A",
        "A is true but R is false",
        "Both A and R are false"
      ],
      "correctAnswers": [
        "Both A and R are true and R explains A"
      ],
      "points": 1,
      "correctFeedback": "✔ Correct\nConcept: Transport connects producers and consumers.",
      "incorrectFeedback": "❌ Review Concept\nExplanation: Transport connects producers and consumers."
    },
    {
      "itemNumber": 2,
      "title": "2. Assertion: India has one of the largest road networks in the world.\nReason: Roads connect even remote villages.",
      "helpText": "",
      "type": "MULTIPLE_CHOICE",
      "required": true,
      "options": [
        "Both A and R are true and R explains A",
        "Both A and R are true but R does not explain A",
        "A is true but R is false",
        "Both A and R are false"
      ],
      "correctAnswers": [
        "Both A and R are true and R explains A"
      ],
      "points": 1,
      "correctFeedback": "✔ Correct\nConcept: Extensive connectivity increases road length.",
      "incorrectFeedback": "❌ Review Concept\nExplanation: Extensive connectivity increases road length."
    },
    
    {
      "itemNumber": 32,
      "title": "30. Assertion: Balanced transport system is essential for national unity.\nReason: It connects remote regions with rest of country.",
      "helpText": "",
      "type": "MULTIPLE_CHOICE",
      "required": true,
      "options": [
        "Both A and R are true and R explains A",
        "Both A and R are true but R does not explain A",
        "A is true but R is false",
        "Both A and R are false"
      ],
      "correctAnswers": [
        "Both A and R are true and R explains A"
      ],
      "points": 1,
      "correctFeedback": "✔ Correct\nConcept: Connectivity strengthens integration.",
      "incorrectFeedback": "❌ Review Concept\nExplanation: Connectivity strengthens integration."
    }
  ];


/* =========================================================
   DISPLAY QUESTIONS
   ========================================================= */


function renderQuestions(){

    const container =
        document.getElementById("questionsContainer");

    container.innerHTML = "";

    questions.forEach((question,index)=>{

        let optionsHTML = "";

        question.options.forEach((option,optionIndex)=>{

            optionsHTML += `

                <label class="option">

                    <input
                        type="radio"
                        name="question_${index}"
                        value="${escapeHTML(option)}"
                    >

                    ${escapeHTML(option)}

                </label>

            `;

        });


        container.innerHTML += `

            <div class="card">

                <div class="question-number">
                    QUESTION ${index + 1}
                </div>

                <div class="question-text">
                    ${escapeHTML(question.title)}
                </div>

                ${optionsHTML}

            </div>

        `;

    });

}


/* =========================================================
   SUBMIT TEST
   ========================================================= */


function submitTest(){

    const studentName =
        document.getElementById("studentName").value.trim();

    const studentPhone =
        document.getElementById("studentPhone").value.trim();


    if(!studentName){

        alert("Please enter Student Name.");

        document.getElementById("studentName").focus();

        return;

    }


    if(!studentPhone){

        alert("Please enter Phone Number.");

        document.getElementById("studentPhone").focus();

        return;

    }


    let unanswered = [];


    questions.forEach((question,index)=>{

        const selected =
            document.querySelector(
                `input[name="question_${index}"]:checked`
            );

        if(!selected){

            unanswered.push(index + 1);

        }

    });


    if(unanswered.length > 0){

        alert(
            "Please answer all questions.\n\n" +
            "Unanswered questions: " +
            unanswered.join(", ")
        );

        return;

    }


    let score = 0;

    let reviewHTML = "";


    questions.forEach((question,index)=>{


        const selected =
            document.querySelector(
                `input[name="question_${index}"]:checked`
            );


        const studentAnswer =
            selected.value;


        const correctAnswers = Array.isArray(question.correctAnswers)
            ? question.correctAnswers
            : [];

        const isCorrect =
            correctAnswers.includes(studentAnswer);

        if(isCorrect){
            score++;
        }

        const feedback = isCorrect
            ? (question.correctFeedback || "")
            : (question.incorrectFeedback || "");

        reviewHTML += `

            <div class="card ${isCorrect ? "correct" : "wrong"}">

                <div class="question-number">

                    QUESTION ${index + 1}
                    ${isCorrect ? "✔ CORRECT" : "✘ WRONG"}

                </div>

                <div class="question-text">

                    ${escapeHTML(question.title)}

                </div>

                <div class="answer-box">

                    <strong>Your Answer:</strong><br>

                    <span class="${isCorrect ? "correct-answer" : "wrong-answer"}">

                        ${escapeHTML(studentAnswer)}

                    </span>

                </div>

                <div class="answer-box">

                    <strong>Correct Answer:</strong><br>

                    <span class="correct-answer">

                        ${escapeHTML(correctAnswers.join(", "))}

                    </span>

                </div>

                <div class="explanation">

                    <strong>${isCorrect ? "Correct Feedback:" : "Explanation:"}</strong><br><br>

                    ${escapeHTML(feedback)}

                </div>

            </div>

        `;

    });


    document.getElementById("testContainer")
        .style.display = "none";


    const resultContainer =
        document.getElementById("resultContainer");


    resultContainer.style.display = "block";


    resultContainer.innerHTML = `

        <div class="result-summary">

            <h2>TEST RESULT</h2>

            <p><strong>Student:</strong>
            ${escapeHTML(studentName)}</p>

            <p><strong>Phone:</strong>
            ${escapeHTML(studentPhone)}</p>

            <div class="score">

                ${score} / ${questions.length}

            </div>

            <p>

                You can now review every question,
                your answer, correct answer and feedback.

            </p>

        </div>


        ${reviewHTML}

    `;


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =========================================================
   SECURITY / HTML ESCAPE
   ========================================================= */


function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* START TEST */


renderQuestions();


</script>

</body>
</html>
