<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 9 Maths – Free Test 1 | BET Masterclass</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b1117;
    color:#f5f5f5;
}

/* HEADER */

header{
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    border-bottom:1px solid #2b3945;
    background:#0b1117;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#f4bd4f;
}

.back-btn{
    color:#f4bd4f;
    text-decoration:none;
    border:1px solid #b88425;
    padding:10px 18px;
    border-radius:8px;
}

/* TITLE */

.test-header{
    text-align:center;
    padding:30px 15px;
    border-bottom:1px solid #2b3945;
}

.test-header h1{
    margin:0;
    color:#ffc75f;
    font-size:28px;
}

.test-header p{
    color:#c5cbd3;
}

/* MAIN */

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

/* CARDS */

.card{
    background:#1b232b;
    border:1px solid #31414e;
    border-radius:12px;
    padding:22px;
    margin-bottom:20px;
}

.card h2{
    margin-top:0;
    color:#ffc75f;
}

/* STUDENT */

.student-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}
.input-group{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.input-group label{
    color:#f5f5f5;
    font-size:16px;
    font-weight:500;
}
input[type="text"],
input[type="tel"]{
    width:100%;
    padding:14px;
    background:#10171e;
    border:1px solid #344654;
    border-radius:7px;
    color:white;
    font-size:15px;
}

/* QUESTION */

.question-number{
    color:#ffc75f;
    font-weight:bold;
    margin-bottom:15px;
}

.question-text{
    white-space:pre-line;
    line-height:1.6;
    font-size:17px;
    margin-bottom:18px;
}

/* OPTIONS */

.option{
    display:block;
    background:#10171e;
    border:1px solid #344654;
    padding:14px;
    border-radius:7px;
    margin-bottom:10px;
    cursor:pointer;
}

.option:hover{
    border-color:#ffc75f;
}

.option input{
    margin-right:12px;
}

/* SUBMIT */

.submit-area{
    text-align:center;
    padding:20px;
}

.submit-btn{
    border:none;
    background:linear-gradient(90deg,#e6a51b,#ffe28e);
    color:#111;
    font-size:16px;
    font-weight:bold;
    padding:16px 40px;
    border-radius:9px;
    cursor:pointer;
}

/* RESULT */

.result-summary{
    text-align:center;
    background:#1b232b;
    border:1px solid #31414e;
    border-radius:12px;
    padding:25px;
    margin-bottom:25px;
}

.score{
    color:#ffc75f;
    font-size:30px;
    font-weight:bold;
}

.correct{
    border-left:5px solid #42c97b;
}

.wrong{
    border-left:5px solid #e75b5b;
}

.answer-box{
    padding:12px;
    margin-top:10px;
    border-radius:6px;
    background:#10171e;
}

.correct-answer{
    color:#70e69a;
}

.wrong-answer{
    color:#ff7777;
}

.explanation{
    margin-top:15px;
    padding:15px;
    background:#252f38;
    border-radius:7px;
    line-height:1.5;
}


/* QUESTION NAVIGATOR */
.test-layout{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:20px;align-items:start;}
.question-sidebar{position:sticky;top:15px;background:#1b232b;border:1px solid #31414e;border-radius:12px;padding:16px;}
.question-sidebar h3{margin:0 0 12px;color:#ffc75f;font-size:16px;}
.question-legend{font-size:12px;color:#c5cbd3;line-height:1.8;margin-bottom:12px;}
.legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;}
.legend-answered{background:#42c97b;}.legend-unanswered{background:#5b6873;}
.question-nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.question-nav-btn{width:100%;aspect-ratio:1;border:none;border-radius:6px;background:#34414c;color:#f5f5f5;font-weight:bold;cursor:pointer;}
.question-nav-btn:hover{outline:1px solid #ffc75f;}.question-nav-btn.answered{background:#1f7a4f;}.question-nav-btn.unanswered{background:#3a4650;}
/* RESULT QUESTION REVIEW */
.result-option{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#10171e;border:1px solid #344654;padding:14px;border-radius:7px;margin-bottom:10px;font-size:16px;}
.result-option-text{flex:1;}.result-option.selected-correct,.result-option.actual-correct{border-color:#42c97b;background:#13251d;}.result-option.selected-wrong{border-color:#e75b5b;background:#2a1719;}
.answer-status{font-size:20px;font-weight:bold;min-width:25px;text-align:right;}.tick{color:#70e69a;}.cross{color:#ff7777;}
.result-explanation{margin-top:18px;padding:16px;background:#252f38;border-radius:7px;line-height:1.6;}.result-explanation strong{color:#ffc75f;}

@media(max-width:600px){

    .student-grid{
        grid-template-columns:1fr;
    }

    .test-header h1{
        font-size:22px;
    }

    .test-layout{
        grid-template-columns:1fr;
    }

    .question-sidebar{
        position:static;
        order:-1;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">🎓 BET MASTERCLASS</div>

    <a href="class9.html" class="back-btn">
        ← Back to Class 9
    </a>

</header>


<div class="test-header">

    <h1>CLASS 9 MATHS – FREE TEST 1</h1>

    <p>Answer all questions and submit your test.</p>

</div>


<div class="container" id="testContainer">

    <!-- STUDENT DETAILS -->

    <div class="card student-card">

    <h2>Student Details</h2>

    <div class="student-grid">

        <div class="input-group">
            <label for="studentName">Student Name</label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
                required
            >
        </div>

        <div class="input-group">
            <label for="studentPhone">Phone Number</label>

            <input
                type="tel"
                id="studentPhone"
                placeholder="Enter your phone number"
                required
            >
        </div>

    </div>

</div>


    <!-- QUESTIONS + QUESTION STATUS -->

    <div class="test-layout">

        <div id="questionsContainer"></div>

        <aside class="question-sidebar">

            <h3>Question Status</h3>

            <div class="question-legend">
                <span class="legend-dot legend-answered"></span> Answered<br>
                <span class="legend-dot legend-unanswered"></span> Not Answered
            </div>

            <div id="questionNav" class="question-nav-grid"></div>

        </aside>

    </div>


    <div class="submit-area">

        <button class="submit-btn" onclick="submitTest()">
            SUBMIT TEST
        </button>

    </div>

</div>


<div class="container" id="resultContainer" style="display:none;"></div>


<script>

/* FIX VERSION: correctAnswers + feedback schema */

/* =========================================================
   MATHS TEST 1 DATA
   =========================================================

   REPLACE THIS SAMPLE DATA WITH YOUR EXTRACTED MATHS TEST 1
   QUESTIONS.

   The system automatically displays ALL questions in this array.
*/


const questions = [
    
    {
      "itemNumber": 1,
      "title": "1. Assertion: Transport is necessary for economic development.\nReason: Goods do not move on their own.",
      "helpText": "",
      "type": "MULTIPLE_CHOICE",
      "required": true,
      "options": [
        "Both A and R are true and R explains A",
        "Both A and R are true but R does not explain A",
        "A is true but R is false",
        "Both A and R are false"
      ],
      "correctAnswers": [
        "Both A and R are true and R explains A"
      ],
      "points": 1,
      "correctFeedback": "✔ Correct\nConcept: Transport connects producers and consumers.",
      "incorrectFeedback": "❌ Review Concept\nExplanation: Transport connects producers and consumers."
    },
    {
      "itemNumber": 2,
      "title": "2. Assertion: India has one of the largest road networks in the world.\nReason: Roads connect even remote villages.",
      "helpText": "",
      "type": "MULTIPLE_CHOICE",
      "required": true,
      "options": [
        "Both A and R are true and R explains A",
        "Both A and R are true but R does not explain A",
        "A is true but R is false",
        "Both A and R are false"
      ],
      "correctAnswers": [
        "Both A and R are true and R explains A"
      ],
      "points": 1,
      "correctFeedback": "✔ Correct\nConcept: Extensive connectivity increases road length.",
      "incorrectFeedback": "❌ Review Concept\nExplanation: Extensive connectivity increases road length."
    },
    {
      "itemNumber": 5,
      "title": "3. Assertion: Golden Quadrilateral connects major metros.\nReason: It improves industrial and trade connectivity.",
      "helpText": "",
      "type": "MULTIPLE_CHOICE",
      "required": true,
      "options": [
        "Both A and R are true and R explains A",
        "Both A and R are true but R does not explain A",
        "A is true but R is false",
        "Both A and R are false"
      ],
      "correctAnswers": [
        "Both A and R are true and R explains A"
      ],
      "points": 1,
      "correctFeedback": "✔ Correct\nConcept: It boosts economic integration.",
      "incorrectFeedback": "❌ Review Concept\nExplanation: It boosts economic integration."
    },
    
  ];


/* =========================================================
   DISPLAY QUESTIONS
   ========================================================= */


function renderQuestions(){

    const container = document.getElementById("questionsContainer");
    const questionNav = document.getElementById("questionNav");

    container.innerHTML = "";
    questionNav.innerHTML = "";

    questions.forEach((question,index)=>{

        let optionsHTML = "";

        question.options.forEach((option)=>{

            optionsHTML += `
                <label class="option">
                    <input type="radio" name="question_${index}" value="${escapeHTML(option)}" onchange="updateQuestionStatus(${index})">
                    ${escapeHTML(option)}
                </label>
            `;
        });

        container.innerHTML += `
            <div class="card" id="questionCard_${index}">
                <div class="question-number">QUESTION ${index + 1}</div>
                <div class="question-text">${escapeHTML(question.title)}</div>
                ${optionsHTML}
            </div>
        `;

        questionNav.innerHTML += `
            <button type="button" class="question-nav-btn unanswered" id="navQuestion_${index}" onclick="goToQuestion(${index})" title="Question ${index + 1}">${index + 1}</button>
        `;
    });
}

function updateQuestionStatus(index){
    const selected = document.querySelector(`input[name="question_${index}"]:checked`);
    const navButton = document.getElementById(`navQuestion_${index}`);
    if(!navButton) return;
    if(selected){
        navButton.classList.remove("unanswered");
        navButton.classList.add("answered");
    }else{
        navButton.classList.remove("answered");
        navButton.classList.add("unanswered");
    }
}

function goToQuestion(index){
    const card = document.getElementById(`questionCard_${index}`);
    if(card){ card.scrollIntoView({behavior:"smooth",block:"center"}); }
}



/* =========================================================
   SUBMIT TEST
   ========================================================= */


function submitTest(){

    const studentName = document.getElementById("studentName").value.trim();
    const studentPhone = document.getElementById("studentPhone").value.trim();

    if(!studentName){ alert("Please enter Student Name."); document.getElementById("studentName").focus(); return; }
    if(!studentPhone){ alert("Please enter Phone Number."); document.getElementById("studentPhone").focus(); return; }

    let unanswered = [];
    questions.forEach((question,index)=>{
        const selected = document.querySelector(`input[name="question_${index}"]:checked`);
        if(!selected) unanswered.push(index + 1);
    });

    if(unanswered.length > 0){
        alert("Please answer all questions.\n\nUnanswered questions: " + unanswered.join(", "));
        goToQuestion(unanswered[0] - 1);
        return;
    }

    let score = 0;
    let reviewHTML = "";

    questions.forEach((question,index)=>{
        const selected = document.querySelector(`input[name="question_${index}"]:checked`);
        const studentAnswer = selected.value;
        const correctAnswers = Array.isArray(question.correctAnswers) ? question.correctAnswers : [];
        const isCorrect = correctAnswers.includes(studentAnswer);
        if(isCorrect) score++;

        let resultOptionsHTML = "";
        question.options.forEach((option)=>{
            const isSelected = option === studentAnswer;
            const isActualCorrect = correctAnswers.includes(option);
            let optionClass = "";
            let statusMark = "";

            if(isSelected && isActualCorrect){
                optionClass = "selected-correct";
                statusMark = `<span class="answer-status tick">✓</span>`;
            }else if(isSelected && !isActualCorrect){
                optionClass = "selected-wrong";
                statusMark = `<span class="answer-status cross">✗</span>`;
            }else if(!isSelected && isActualCorrect){
                optionClass = "actual-correct";
                statusMark = `<span class="answer-status tick">✓</span>`;
            }

            resultOptionsHTML += `
                <div class="result-option ${optionClass}">
                    <span class="result-option-text">${escapeHTML(option)}</span>
                    ${statusMark}
                </div>
            `;
        });

        const explanationText = isCorrect ? (question.correctFeedback || "") : (question.incorrectFeedback || "");

        reviewHTML += `
            <div class="card ${isCorrect ? "correct" : "wrong"}">
                <div class="question-number">QUESTION ${index + 1} ${isCorrect ? "✓ CORRECT" : "✗ WRONG"}</div>
                <div class="question-text">${escapeHTML(question.title)}</div>
                <div class="result-options">${resultOptionsHTML}</div>
                <div class="result-explanation">
                    <strong>Explanation:</strong><br><br>
                    ${escapeHTML(explanationText)}
                </div>
            </div>
        `;
    });

    document.getElementById("testContainer").style.display = "none";
    const resultContainer = document.getElementById("resultContainer");
    resultContainer.style.display = "block";
    resultContainer.innerHTML = `
        <div class="result-summary">
            <h2>TEST RESULT</h2>
            <p><strong>Student:</strong> ${escapeHTML(studentName)}</p>
            <p><strong>Phone:</strong> ${escapeHTML(studentPhone)}</p>
            <div class="score">${score} / ${questions.length}</div>
            <p>Review each question below. Your selected answer is marked, and the correct answer is shown with a tick where needed.</p>
        </div>
        ${reviewHTML}
    `;
    window.scrollTo({top:0,behavior:"smooth"});
}



/* =========================================================
   SECURITY / HTML ESCAPE
   ========================================================= */


function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* START TEST */


renderQuestions();


</script>

</body>
</html>
