<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 9 Maths – Free Test 1 | BET Masterclass</title>

<style>
:root{
  --bg:#080c10;
  --card:#171e24;
  --card2:#10161b;
  --gold:#f2bd42;
  --text:#f4f4f4;
  --muted:#aeb7c0;
  --border:#30404b;
  --green:#28b463;
  --red:#e74c3c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */

header{
  background:#060a0e;
  border-bottom:1px solid #26313a;
  padding:14px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:24px;
  font-weight:bold;
  color:var(--gold);
}

.back-btn{
  color:var(--gold);
  text-decoration:none;
  border:1px solid #9b7026;
  padding:10px 18px;
  border-radius:8px;
}

/* PAGE HEADER */

.test-header{
  text-align:center;
  padding:32px 20px;
  border-bottom:1px solid #26313a;
}

.test-header h1{
  color:var(--gold);
  margin-bottom:10px;
}

.test-header p{
  color:var(--muted);
}

/* MAIN CONTENT */

#testPage,
#resultPage{
  padding:25px 20px 60px;
}

.student-box,
.question-card,
.result-card,
.summary-box{
  max-width:900px;
  margin:20px auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  padding:25px;
}

/* STUDENT DETAILS */

.student-box h2{
  color:var(--gold);
  margin-bottom:20px;
}

.student-inputs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

input[type="text"]{
  width:100%;
  padding:14px;
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:8px;
  color:white;
  font-size:16px;
}

/* QUESTIONS */

.question-number{
  color:var(--gold);
  font-size:14px;
  font-weight:bold;
  margin-bottom:15px;
}

.question-text{
  font-size:18px;
  line-height:1.7;
  white-space:pre-line;
  margin-bottom:20px;
}

.option{
  display:block;
  padding:15px;
  margin-bottom:10px;
  background:var(--card2);
  border:1px solid #33414a;
  border-radius:8px;
  cursor:pointer;
  line-height:1.4;
}

.option:hover{
  border-color:var(--gold);
}

.option input{
  margin-right:10px;
}

/* SUBMIT */

.submit-area{
  text-align:center;
  margin:35px 0;
}

.submit-btn{
  border:none;
  padding:18px 50px;
  border-radius:9px;
  background:linear-gradient(90deg,#d89929,#ffd25a);
  color:#171717;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

/* RESULT SUMMARY */

.result-title{
  text-align:center;
  color:var(--gold);
  margin-bottom:10px;
  font-size:32px;
}

.result-subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.score-main{
  text-align:center;
  font-size:38px;
  font-weight:bold;
  color:var(--gold);
  margin:15px 0;
}

.score-details{
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
  margin-top:15px;
}

.correct-count{
  color:var(--green);
  font-weight:bold;
}

.wrong-count{
  color:var(--red);
  font-weight:bold;
}

/* REVIEW */

.result-card.correct{
  border-left:5px solid var(--green);
}

.result-card.incorrect{
  border-left:5px solid var(--red);
}

.result-status{
  font-weight:bold;
  margin-bottom:18px;
}

.result-status.correct{
  color:var(--green);
}

.result-status.incorrect{
  color:var(--red);
}

.answer-box{
  padding:14px;
  border-radius:8px;
  margin-top:12px;
  line-height:1.5;
}

.your-answer{
  background:#10161b;
  border:1px solid #33414a;
}

.correct-answer{
  background:rgba(40,180,99,.08);
  border:1px solid rgba(40,180,99,.45);
}

.explanation{
  background:rgba(242,189,66,.07);
  border:1px solid rgba(242,189,66,.35);
}

.answer-label{
  color:var(--gold);
  font-weight:bold;
  margin-bottom:6px;
}

.hidden{
  display:none;
}

@media(max-width:700px){

  header{
    padding:14px 18px;
  }

  .logo{
    font-size:18px;
  }

  .back-btn{
    font-size:13px;
    padding:8px 10px;
  }

  .student-inputs{
    grid-template-columns:1fr;
  }

  .test-header h1{
    font-size:25px;
  }

  .question-card,
  .result-card,
  .student-box,
  .summary-box{
    padding:18px;
  }

  .score-main{
    font-size:30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🎓 BET MASTERCLASS</div>
  <a href="class9.html" class="back-btn">← Back to Class 9</a>
</header>


<!-- ================= TEST PAGE ================= -->

<div id="testPage">

  <section class="test-header">
    <h1>CLASS 9 MATHS – FREE TEST 1</h1>
    <p>Answer all questions and submit your test.</p>
  </section>


  <!-- STUDENT DETAILS -->

  <div class="student-box">

    <h2>Student Details</h2>

    <div class="student-inputs">

      <input
        type="text"
        id="studentName"
        placeholder="Student Name *"
      >

      <input
        type="text"
        id="studentClass"
        placeholder="Class & Section *"
      >

    </div>

  </div>


  <!-- QUESTIONS -->

  <div id="questionsContainer"></div>


  <!-- SUBMIT BUTTON -->

  <div class="submit-area">

    <button class="submit-btn" onclick="submitTest()">
      SUBMIT TEST
    </button>

  </div>

</div>



<!-- ================= RESULT PAGE ================= -->

<div id="resultPage" class="hidden"></div>



<script>

/* =================================================
   QUESTION DATA
   =================================================

   IMPORTANT:

   We will put all your 30 actual extracted questions
   here.

   You DO NOT need to change the display or scoring
   code below.

*/

const questions = [

  {
    number: 1,

    question:
`Sample Question

This is where your actual Maths question will appear.`,

    options: [
      "Option A",
      "Option B",
      "Option C",
      "Option D"
    ],

    answer: "Option A",

    explanation:
      "This is the explanation for the correct answer."
  }

];


/* =================================================
   DISPLAY QUESTIONS
   ================================================= */

function displayQuestions(){

  const container =
    document.getElementById("questionsContainer");

  container.innerHTML = "";

  questions.forEach((q,index) => {

    let html = `

      <div class="question-card">

        <div class="question-number">
          QUESTION ${q.number}
        </div>

        <div class="question-text">
          ${q.question}
        </div>
    `;


    q.options.forEach(option => {

      html += `

        <label class="option">

          <input
            type="radio"
            name="question${index}"
            value="${escapeHtml(option)}"
          >

          ${escapeHtml(option)}

        </label>
      `;

    });


    html += `</div>`;

    container.innerHTML += html;

  });

}



/* =================================================
   SUBMIT TEST
   ================================================= */

function submitTest(){

  const studentName =
    document.getElementById("studentName").value.trim();

  const studentClass =
    document.getElementById("studentClass").value.trim();


  /* CHECK STUDENT DETAILS */

  if(!studentName || !studentClass){

    alert(
      "Please enter Student Name and Class & Section."
    );

    return;

  }


  /* CHECK ALL QUESTIONS ANSWERED */

  for(let i = 0; i < questions.length; i++){

    const selected =
      document.querySelector(
        `input[name="question${i}"]:checked`
      );

    if(!selected){

      alert(
        "Please answer Question " +
        questions[i].number
      );

      return;

    }

  }


  /* CALCULATE SCORE */

  let score = 0;

  let reviewData = [];


  questions.forEach((q,index) => {

    const selected =
      document.querySelector(
        `input[name="question${index}"]:checked`
      );

    const studentAnswer =
      selected ? selected.value : "Not Answered";

    const isCorrect =
      studentAnswer === q.answer;


    if(isCorrect){
      score++;
    }


    reviewData.push({
      question:q,
      studentAnswer:studentAnswer,
      isCorrect:isCorrect
    });

  });


  /* SHOW RESULTS */

  showResults(
    studentName,
    studentClass,
    score,
    reviewData
  );

}



/* =================================================
   SHOW RESULTS PAGE
   ================================================= */

function showResults(
  studentName,
  studentClass,
  score,
  reviewData
){

  const resultPage =
    document.getElementById("resultPage");

  const correct = score;

  const wrong =
    questions.length - score;


  let html = `

    <section class="test-header">

      <h1 class="result-title">
        🎉 TEST COMPLETED
      </h1>

      <p class="result-subtitle">
        ${escapeHtml(studentName)}
        &nbsp; | &nbsp;
        ${escapeHtml(studentClass)}
      </p>

    </section>


    <div class="summary-box">

      <div class="score-main">
        ${score} / ${questions.length}
      </div>

      <div class="score-details">

        <div class="correct-count">
          ✓ Correct: ${correct}
        </div>

        <div class="wrong-count">
          ✗ Wrong: ${wrong}
        </div>

      </div>

    </div>
  `;


  /* SHOW EVERY QUESTION AGAIN */

  reviewData.forEach((item,index) => {

    const q = item.question;

    const statusClass =
      item.isCorrect
        ? "correct"
        : "incorrect";

    const statusText =
      item.isCorrect
        ? "✓ CORRECT"
        : "✗ INCORRECT";


    html += `

      <div class="result-card ${statusClass}">

        <div class="question-number">
          QUESTION ${q.number}
        </div>

        <div class="result-status ${statusClass}">
          ${statusText}
        </div>

        <div class="question-text">
          ${q.question}
        </div>


        <div class="answer-box your-answer">

          <div class="answer-label">
            YOUR ANSWER
          </div>

          ${escapeHtml(item.studentAnswer)}

        </div>


        <div class="answer-box correct-answer">

          <div class="answer-label">
            CORRECT ANSWER
          </div>

          ${escapeHtml(q.answer)}

        </div>


        <div class="answer-box explanation">

          <div class="answer-label">
            EXPLANATION
          </div>

          ${escapeHtml(q.explanation)}

        </div>

      </div>
    `;

  });


  /* ADD BACK BUTTON */

  html += `

    <div class="submit-area">

      <a
        href="class9.html"
        class="back-btn"
      >
        ← BACK TO CLASS 9
      </a>

    </div>
  `;


  resultPage.innerHTML = html;


  /* SWITCH PAGES */

  document
    .getElementById("testPage")
    .classList
    .add("hidden");


  resultPage
    .classList
    .remove("hidden");


  /* SCROLL TO TOP */

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}



/* =================================================
   SECURITY / TEXT DISPLAY
   ================================================= */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}



/* START TEST */

displayQuestions();

</script>

</body>
</html>
